org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental compilation fails on Windows when the project and Pub cache are on
# different drives (IllegalArgumentException: this and base files have different roots).
kotlin.incremental=false
